name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Verilog toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V
          vvp -V
      - run: npm ci
      - run: npm test
